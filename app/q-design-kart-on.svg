<?xml version="1.0" encoding="UTF-8"?>
<!-- Q DESIGN - Kartvizit ÖN YÜZ -->
<!-- Matbaa Teknik Bilgiler: 90x50mm + 3mm taşma payı = 96x56mm -->
<!-- Renk: CMYK | Baskı: Çift yön | Spot UV seçili alanlarda -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1080 600" width="96mm" height="56mm">
  <defs>
    <!-- Ana arka plan lacivert -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>

    <!-- Sol panel koyu desen alanı -->
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#091525"/>
      <stop offset="100%" stop-color="#0d1f35"/>
    </linearGradient>

    <!-- Turuncu yaldız - Q logo için -->
    <linearGradient id="qGoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff9a30"/>
      <stop offset="30%"  stop-color="#e05a00"/>
      <stop offset="60%"  stop-color="#ff7a1a"/>
      <stop offset="80%"  stop-color="#c04500"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>

    <!-- Q logo gölge efekti -->
    <linearGradient id="qShadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#803000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#200800" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Turuncu accent çizgi için -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#e05000"/>
    </linearGradient>

    <!-- Geometrik desen için renk -->
    <linearGradient id="triGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d2040"/>
    </linearGradient>
    <linearGradient id="triGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8020" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cc4400" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="triGrad3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1828"/>
      <stop offset="100%" stop-color="#112235"/>
    </linearGradient>

    <!-- Gölge filtresi -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Parlak ışık filtresi - Spot UV efekti -->
    <filter id="spotUV" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="-2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- Q harfi clip path -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1080" height="600" rx="12" ry="12"/>
    </clipPath>

    <!-- Sol panel clip -->
    <clipPath id="leftPanelClip">
      <rect x="0" y="0" width="265" height="600"/>
    </clipPath>
  </defs>

  <!-- ===== ANA KART ARKAPLAN ===== -->
  <rect x="0" y="0" width="1080" height="600" rx="12" ry="12" fill="url(#bgGrad)"/>

  <!-- ===== SOL GEOMETRİK DESEN PANELİ ===== -->
  <g clip-path="url(#leftPanelClip)">
    <rect x="0" y="0" width="265" height="600" fill="url(#panelGrad)"/>

    <!-- Geometrik 3D Elmas/Üçgen Desen - Izgara -->
    <!-- Satır 1 -->
    <g>
      <!-- Elmas 1,1 -->
      <polygon points="60,10 110,55 60,100 10,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="60,10 110,55 60,100 10,55" fill="url(#triGrad1)"/>
      <polygon points="60,10 110,55 60,55" fill="#193355" opacity="0.9"/>
      <polygon points="110,55 60,100 60,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="10,55 60,100 60,55" fill="#112240" opacity="0.9"/>
      <polygon points="60,10 110,55 60,55" fill="#ff6b00" opacity="0.15"/>

      <!-- Elmas 1,2 -->
      <polygon points="170,10 220,55 170,100 120,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="170,10 220,55 170,55" fill="#193355" opacity="0.9"/>
      <polygon points="220,55 170,100 170,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="120,55 170,100 170,55" fill="#112240" opacity="0.9"/>

      <!-- Elmas üst nokta turuncu -->
      <polygon points="60,10 110,55 60,55" fill="#cc4400" opacity="0.5"/>
    </g>

    <!-- Satır 2 - offset -->
    <g transform="translate(55, 90)">
      <polygon points="60,10 110,55 60,100 10,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="60,10 110,55 60,55" fill="#1a3555" opacity="0.9"/>
      <polygon points="110,55 60,100 60,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="10,55 60,100 60,55" fill="#112240" opacity="0.9"/>
      <!-- Turuncu üçgen -->
      <polygon points="60,10 110,55 60,55" fill="url(#triGrad2)"/>

      <polygon points="170,10 220,55 170,100 120,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="170,10 220,55 170,55" fill="#193355" opacity="0.9"/>
      <polygon points="220,55 170,100 170,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="120,55 170,100 170,55" fill="#112240" opacity="0.9"/>
    </g>

    <!-- Satır 3 -->
    <g transform="translate(0, 180)">
      <polygon points="60,10 110,55 60,100 10,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="60,10 110,55 60,55" fill="#193355" opacity="0.9"/>
      <polygon points="110,55 60,100 60,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="10,55 60,100 60,55" fill="#112240" opacity="0.9"/>

      <polygon points="170,10 220,55 170,100 120,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="170,10 220,55 170,55" fill="#1a3555" opacity="0.9"/>
      <polygon points="220,55 170,100 170,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="120,55 170,100 170,55" fill="#112240" opacity="0.9"/>
      <!-- Turuncu üçgen -->
      <polygon points="170,10 220,55 170,55" fill="url(#triGrad2)"/>
    </g>

    <!-- Satır 4 - offset -->
    <g transform="translate(55, 270)">
      <polygon points="60,10 110,55 60,100 10,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="60,10 110,55 60,55" fill="#1a3555" opacity="0.9"/>
      <polygon points="110,55 60,100 60,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="10,55 60,100 60,55" fill="#112240" opacity="0.9"/>
      <!-- Turuncu üçgen -->
      <polygon points="60,10 110,55 60,55" fill="url(#triGrad2)"/>

      <polygon points="170,10 220,55 170,100 120,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="170,10 220,55 170,55" fill="#193355" opacity="0.9"/>
      <polygon points="220,55 170,100 170,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="120,55 170,100 170,55" fill="#112240" opacity="0.9"/>
    </g>

    <!-- Satır 5 -->
    <g transform="translate(0, 360)">
      <polygon points="60,10 110,55 60,100 10,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="60,10 110,55 60,55" fill="#193355" opacity="0.9"/>
      <polygon points="110,55 60,100 60,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="10,55 60,100 60,55" fill="#112240" opacity="0.9"/>

      <polygon points="170,10 220,55 170,100 120,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="170,10 220,55 170,55" fill="#1a3555" opacity="0.9"/>
      <polygon points="220,55 170,100 170,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="120,55 170,100 170,55" fill="#112240" opacity="0.9"/>
      <!-- Turuncu üçgen -->
      <polygon points="60,10 110,55 60,55" fill="url(#triGrad2)"/>
    </g>

    <!-- Satır 6 - offset -->
    <g transform="translate(55, 450)">
      <polygon points="60,10 110,55 60,100 10,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="60,10 110,55 60,55" fill="#1a3555" opacity="0.9"/>
      <polygon points="110,55 60,100 60,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="10,55 60,100 60,55" fill="#112240" opacity="0.9"/>

      <polygon points="170,10 220,55 170,100 120,55" fill="url(#triGrad1)" stroke="#1e3f60" stroke-width="0.8"/>
      <polygon points="170,10 220,55 170,55" fill="#193355" opacity="0.9"/>
      <polygon points="220,55 170,100 170,55" fill="#0b1c30" opacity="0.9"/>
      <polygon points="120,55 170,100 170,55" fill="#112240" opacity="0.9"/>
      <!-- Turuncu üçgen -->
      <polygon points="170,10 220,55 170,55" fill="url(#triGrad2)"/>
    </g>

    <!-- Sol panel sağ kenarda hafif sınır çizgisi -->
    <line x1="265" y1="0" x2="265" y2="600" stroke="#ff6b00" stroke-width="1.5" stroke-opacity="0.3"/>
    <!-- Üst ve alt turuncu şerit -->
    <rect x="0" y="0" width="265" height="4" fill="#ff6b00" opacity="0.6"/>
    <rect x="0" y="596" width="265" height="4" fill="#ff6b00" opacity="0.6"/>
  </g>

  <!-- ===== SAĞ BÜYÜK Q LOGO ===== -->
  <!-- Q harfinin gölgesi/derinlik katmanı -->
  <g transform="translate(720, 60)" filter="url(#dropShadow)">
    <!-- Q dış halkası - kalın -->
    <path d="M 220,240 C 220,130 140,50 20,50 C -100,50 -180,130 -180,240 C -180,350 -100,430 20,430 C 80,430 135,408 175,370 L 240,440 L 310,370 L 245,302 C 232,318 220,280 220,240 Z
             M 20,340 C -50,340 -100,295 -100,240 C -100,185 -50,140 20,140 C 90,140 140,185 140,240 C 140,262 133,282 120,298 L 55,230 L -15,300 L 52,368 C 35,376 28,378 20,378 Z"
          fill="url(#qShadowGrad)" opacity="0.4" transform="translate(8,10)"/>
    <!-- Q ana gövde - turuncu yaldız -->
    <path d="M 220,240 C 220,130 140,50 20,50 C -100,50 -180,130 -180,240 C -180,350 -100,430 20,430 C 80,430 135,408 175,370 L 240,440 L 310,370 L 245,302 C 232,318 220,280 220,240 Z
             M 20,340 C -50,340 -100,295 -100,240 C -100,185 -50,140 20,140 C 90,140 140,185 140,240 C 140,262 133,282 120,298 L 55,230 L -15,300 L 52,368 C 35,376 28,378 20,378 Z"
          fill="url(#qGoldGrad)"/>
    <!-- Q üst highlight -->
    <path d="M 220,240 C 220,130 140,50 20,50 C -30,50 -75,70 -108,103 C -72,72 -28,55 20,55 C 138,55 215,133 215,240 Z"
          fill="#ffb060" opacity="0.4"/>
  </g>

  <!-- ===== İSİM ve ÜNVAN ===== -->
  <!-- İsim -->
  <text x="310" y="130"
        font-family="'Arial Black', 'Helvetica Neue', sans-serif"
        font-size="60" font-weight="900"
        fill="#ffffff"
        filter="url(#spotUV)"
        letter-spacing="1">Uğur BAKIR</text>

  <!-- Ünvan -->
  <text x="310" y="180"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="24" font-weight="400"
        fill="#b0c4d8"
        letter-spacing="5">GENEL MÜDÜR</text>

  <!-- Turuncu ince çizgi - isim altı -->
  <rect x="310" y="195" width="120" height="2.5" rx="1" fill="url(#accentGrad)"/>

  <!-- ===== İLETİŞİM BİLGİLERİ ===== -->
  <!-- Telefon ikonu -->
  <g transform="translate(310, 235)">
    <circle cx="14" cy="14" r="14" fill="#ff6b00" opacity="0.15"/>
    <text x="14" y="20" font-family="Arial" font-size="16" fill="#ff6b00" text-anchor="middle">📞</text>
    <text x="38" y="22" font-family="'Arial', sans-serif" font-size="22" fill="#d0dce8" letter-spacing="1">0507 977 98 44</text>
  </g>

  <!-- Email ikonu -->
  <g transform="translate(310, 290)">
    <circle cx="14" cy="14" r="14" fill="#ff6b00" opacity="0.15"/>
    <text x="14" y="20" font-family="Arial" font-size="16" fill="#ff6b00" text-anchor="middle">✉</text>
    <text x="38" y="22" font-family="'Arial', sans-serif" font-size="22" fill="#d0dce8" letter-spacing="0.5">ugur@q-design.com.tr</text>
  </g>

  <!-- Web ikonu -->
  <g transform="translate(310, 345)">
    <circle cx="14" cy="14" r="14" fill="#ff6b00" opacity="0.15"/>
    <text x="14" y="20" font-family="Arial" font-size="16" fill="#ff6b00" text-anchor="middle">🌐</text>
    <text x="38" y="22" font-family="'Arial', sans-serif" font-size="22" fill="#d0dce8" letter-spacing="0.5">www.q-design.com.tr</text>
  </g>

  <!-- Adres ikonu -->
  <g transform="translate(310, 395)">
    <circle cx="14" cy="14" r="14" fill="#ff6b00" opacity="0.15"/>
    <text x="14" y="20" font-family="Arial" font-size="16" fill="#ff6b00" text-anchor="middle">📍</text>
    <text x="38" y="19" font-family="'Arial', sans-serif" font-size="21" fill="#d0dce8" letter-spacing="0.3">Orta Mahalle, Keban Sokak No:10</text>
    <text x="38" y="44" font-family="'Arial', sans-serif" font-size="21" fill="#d0dce8" letter-spacing="0.3">Egemen Sanayi Sitesi C18, Tuzla / İstanbul</text>
  </g>

  <!-- ===== SAĞ ÜST: Q UICK / Q UALITY / Q UEST ===== -->
  <g transform="translate(620, 55)">
    <!-- Q UICK -->
    <text x="0" y="0" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#ff6b00">Q</text>
    <text x="38" y="0" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#8aa8c4" letter-spacing="2"> UICK</text>
    <!-- Q UALITY -->
    <text x="0" y="44" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#ff6b00">Q</text>
    <text x="38" y="44" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#8aa8c4" letter-spacing="2"> UALITY</text>
    <!-- Q UEST -->
    <text x="0" y="88" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#ff6b00">Q</text>
    <text x="38" y="88" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#8aa8c4" letter-spacing="2"> UEST</text>
    <!-- Alt accent çizgi -->
    <rect x="0" y="100" width="80" height="2.5" rx="1" fill="url(#accentGrad)"/>
  </g>

  <!-- ===== ALT ÇUBUK: AMBALAJ | TASARIM | ÜRETİM | ÇÖZÜM ===== -->
  <line x1="310" y1="548" x2="930" y2="548" stroke="#1e3f60" stroke-width="1.5"/>
  <g transform="translate(310, 575)">
    <text x="0"   y="0" font-family="'Arial', sans-serif" font-size="20" font-weight="400" fill="#6a8aaa" letter-spacing="3">AMBALAJ</text>
    <text x="155" y="0" font-family="'Arial', sans-serif" font-size="18" fill="#ff6b00" opacity="0.7">|</text>
    <text x="175" y="0" font-family="'Arial', sans-serif" font-size="20" font-weight="400" fill="#6a8aaa" letter-spacing="3">TASARIM</text>
    <text x="330" y="0" font-family="'Arial', sans-serif" font-size="18" fill="#ff6b00" opacity="0.7">|</text>
    <text x="350" y="0" font-family="'Arial', sans-serif" font-size="20" font-weight="400" fill="#6a8aaa" letter-spacing="3">ÜRETİM</text>
    <text x="500" y="0" font-family="'Arial', sans-serif" font-size="18" fill="#ff6b00" opacity="0.7">|</text>
    <text x="520" y="0" font-family="'Arial', sans-serif" font-size="20" font-weight="400" fill="#6a8aaa" letter-spacing="3">ÇÖZÜM</text>
  </g>

  <!-- ===== TURUNCU ALT ACCENT ÇİZGİSİ ===== -->
  <rect x="310" y="590" width="60" height="3" rx="1.5" fill="url(#accentGrad)"/>

</svg>
