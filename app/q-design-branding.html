<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q DESIGN - Kurumsal Kimlik Mockup</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --surface-color: #1a1a1a;
            --primary-accent: #ff6b00;
            --text-main: #ffffff;
            --text-muted: #888888;
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 107, 0, 0.1);
        }

        [data-theme="navy"] {
            --bg-color: #050b14;
            --surface-color: #0a1321;
            --primary-accent: #ff6b00;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 107, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: #111; /* Table background */
            background-image: radial-gradient(circle at center, #222 0%, #000 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
        }

        h1 { margin: 0; font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; }
        h1 span { color: var(--primary-accent); font-weight: 800; }

        .theme-switcher button {
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 10px;
            transition: all 0.3s ease;
        }
        .theme-switcher button.active {
            background: var(--primary-accent);
            color: #000;
            border-color: var(--primary-accent);
            font-weight: 600;
        }

        .showcase {
            display: flex;
            flex-wrap: wrap;
            gap: 60px;
            padding: 60px 20px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1200px;
        }

        .section-title {
            width: 100%;
            text-align: center;
            margin-bottom: -30px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 0.9rem;
        }

        /* --- Business Card (Kartvizit) --- */
        .b-card {
            width: 400px;
            height: 230px;
            background: var(--surface-color);
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        .b-card-front {
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-color), var(--surface-color));
        }

        .b-card-front .logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 3px;
            z-index: 2;
        }
        .b-card-front .logo span { color: var(--primary-accent); }
        .b-card-front .tagline {
            color: var(--text-muted);
            letter-spacing: 4px;
            font-size: 0.7rem;
            margin-top: 10px;
            text-transform: uppercase;
            z-index: 2;
        }

        .mesh-accent {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,107,0,0.15) 0%, transparent 70%);
            top: -50px;
            right: -50px;
            border-radius: 50%;
        }

        .b-card-back {
            justify-content: space-between;
            padding: 30px;
            background: var(--bg-color);
        }
        
        .b-card-back .top { display: flex; justify-content: space-between; align-items: flex-start; }
        .b-card-back .logo-small { font-size: 1.5rem; font-weight: 800; }
        .b-card-back .logo-small span { color: var(--primary-accent); }

        .b-card-back .person { margin-top: 15px; }
        .b-card-back .person h2 { margin: 0; font-size: 1.4rem; color: var(--text-main); }
        .b-card-back .person p { margin: 5px 0 0; color: var(--primary-accent); font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; }

        .b-card-back .contact { align-self: flex-end; width: 100%; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }

        /* --- ID Badge (Yaka Kartı) --- */
        .id-badge-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lanyard {
            width: 15px;
            height: 60px;
            background: var(--primary-accent);
            border-radius: 5px 5px 0 0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            position: relative;
        }
        .lanyard::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 20px;
            border: 3px solid #777;
            border-radius: 5px;
        }

        .id-badge {
            width: 240px;
            height: 380px;
            background: linear-gradient(to bottom, var(--surface-color), var(--bg-color));
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
            transition: all 0.5s ease;
        }

        .id-badge .hole {
            position: absolute;
            top: 15px;
            width: 40px;
            height: 8px;
            background: #111;
            border-radius: 10px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        .id-badge .logo-badge { font-size: 1.5rem; font-weight: 800; margin-top: 10px; margin-bottom: 25px; }
        .id-badge .logo-badge span { color: var(--primary-accent); }

        .id-badge .photo {
            width: 100px;
            height: 100px;
            background: #333;
            border-radius: 50%;
            border: 3px solid var(--primary-accent);
            margin-bottom: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>');
            background-size: 60%;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .id-badge .name { font-size: 1.3rem; font-weight: 600; margin-bottom: 5px; color: var(--text-main); }
        .id-badge .role { font-size: 0.8rem; color: var(--primary-accent); letter-spacing: 1px; margin-bottom: 25px; text-transform: uppercase; }

        .id-badge .barcode {
            width: 80%;
            height: 40px;
            background: repeating-linear-gradient(90deg, #fff, #fff 2px, transparent 2px, transparent 4px, #fff 4px, #fff 5px, transparent 5px, transparent 8px);
            opacity: 0.5;
            margin-top: auto;
        }
        
        .id-badge .orange-stripe {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 10px;
            background: var(--primary-accent);
        }

    </style>
</head>
<body>

    <header>
        <h1><span>Q</span> DESIGN Mockups</h1>
        <div class="theme-switcher">
            <button class="active" onclick="setTheme('black')">Siyah & Turuncu</button>
            <button onclick="setTheme('navy')">Lacivert & Turuncu</button>
        </div>
    </header>

    <div class="showcase">
        
        <div class="section-title">Kartvizit Tasarımı</div>
        
        <!-- Business Card Front -->
        <div class="b-card b-card-front">
            <div class="mesh-accent"></div>
            <div class="logo"><span>Q</span> DESIGN</div>
            <div class="tagline">Quality &bull; Quest</div>
        </div>

        <!-- Business Card Back -->
        <div class="b-card b-card-back">
            <div class="mesh-accent" style="top: auto; bottom: -50px; left: -50px; right: auto;"></div>
            <div class="top">
                <div class="person">
                    <h2>Ahmet Özdemir</h2>
                    <p>KURUCU / YÖNETİCİ</p>
                </div>
                <div class="logo-small"><span>Q</span></div>
            </div>
            <div class="contact">
                <div>+90 555 123 45 67</div>
                <div>ahmet@qdesign.com.tr</div>
                <div>www.qdesign.com.tr</div>
            </div>
        </div>

        <div class="section-title" style="margin-top: 40px;">Personel Yaka Kartı</div>

        <!-- ID Badge -->
        <div class="id-badge-container">
            <div class="lanyard"></div>
            <div class="id-badge">
                <div class="hole"></div>
                <div class="logo-badge"><span>Q</span> DESIGN</div>
                <div class="photo"></div>
                <div class="name">Ahmet Özdemir</div>
                <div class="role">Yönetim Kurulu Başkanı</div>
                <div class="barcode"></div>
                <div class="orange-stripe"></div>
            </div>
        </div>

    </div>

    <script>
        function setTheme(theme) {
            const btns = document.querySelectorAll('.theme-switcher button');
            btns.forEach(btn => btn.classList.remove('active'));

            if (theme === 'navy') {
                document.documentElement.setAttribute('data-theme', 'navy');
                btns[1].classList.add('active');
            } else {
                document.documentElement.removeAttribute('data-theme');
                btns[0].classList.add('active');
            }
        }
    </script>
</body>
</html>
