<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q DESIGN - Daha İyisi Mümkün</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            /* Black-Orange Theme (Default) */
            --bg-color: #0a0a0a;
            --surface-color: #1a1a1a;
            --primary-accent: #ff6b00; /* Bright metallic orange */
            --text-main: #ffffff;
            --text-muted: #888888;
            --glass-bg: rgba(20, 20, 20, 0.7);
            --glass-border: rgba(255, 107, 0, 0.3);
            --mesh-pattern: radial-gradient(circle at center, rgba(255, 107, 0, 0.15) 0%, transparent 70%);
        }

        [data-theme="navy"] {
            /* Navy-Orange Theme */
            --bg-color: #050b14;
            --surface-color: #0a1321;
            --primary-accent: #ff6b00;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --glass-bg: rgba(10, 19, 33, 0.7);
            --glass-border: rgba(255, 107, 0, 0.3);
            --mesh-pattern: radial-gradient(circle at center, rgba(255, 107, 0, 0.2) 0%, transparent 70%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
            position: relative;
        }

        /* Abstract Triangular Mesh Background Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(30deg, var(--bg-color) 12%, transparent 12.5%, transparent 87%, var(--bg-color) 87.5%, var(--bg-color)), 
                linear-gradient(150deg, var(--bg-color) 12%, transparent 12.5%, transparent 87%, var(--bg-color) 87.5%, var(--bg-color)), 
                linear-gradient(30deg, var(--bg-color) 12%, transparent 12.5%, transparent 87%, var(--bg-color) 87.5%, var(--bg-color)), 
                linear-gradient(150deg, var(--bg-color) 12%, transparent 12.5%, transparent 87%, var(--bg-color) 87.5%, var(--bg-color)), 
                linear-gradient(60deg, var(--surface-color) 25%, transparent 25.5%, transparent 75%, var(--surface-color) 75%, var(--surface-color)), 
                linear-gradient(60deg, var(--surface-color) 25%, transparent 25.5%, transparent 75%, var(--surface-color) 75%, var(--surface-color));
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
            opacity: 0.15;
            z-index: -2;
            transition: background-image 0.5s ease;
        }

        body::after {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw; height: 150vh;
            background: var(--mesh-pattern);
            z-index: -1;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span.q {
            color: var(--primary-accent);
            text-shadow: 0 0 15px rgba(255, 107, 0, 0.4);
        }

        .theme-switcher {
            display: flex;
            gap: 10px;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            border-color: var(--primary-accent);
            color: var(--primary-accent);
        }

        .theme-btn.active {
            background: var(--primary-accent);
            color: #000;
            border-color: var(--primary-accent);
            box-shadow: 0 0 10px rgba(255,107,0,0.5);
        }

        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        h1 {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInDown 1s ease;
        }

        h1 span {
            color: var(--primary-accent);
            -webkit-text-fill-color: var(--primary-accent);
            text-shadow: 0 0 30px rgba(255, 107, 0, 0.6);
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--text-muted);
            letter-spacing: 5px;
            margin-bottom: 50px;
            text-transform: uppercase;
            animation: fadeInUp 1s ease 0.3s both;
        }

        .glass-cards {
            display: flex;
            gap: 30px;
            margin-top: 30px;
            animation: fadeInUp 1s ease 0.6s both;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 30px;
            width: 250px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
            cursor: pointer;
            text-align: left;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 20px rgba(255, 107, 0, 0.2);
            border-color: var(--primary-accent);
        }

        .card h3 {
            color: var(--primary-accent);
            margin-bottom: 15px;
            font-size: 1.3rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="q">Q</span> DESIGN
        </div>
        <div class="theme-switcher">
            <button class="theme-btn active" onclick="setTheme('black')">Siyah & Turuncu</button>
            <button class="theme-btn" onclick="setTheme('navy')">Lacivert & Turuncu</button>
        </div>
    </header>

    <section class="hero">
        <h1>Daha İyisi <span>Mümkün</span></h1>
        <div class="subtitle">Quick &bull; Quality &bull; Quest</div>
        
        <div class="glass-cards">
            <div class="card">
                <h3>AMBALAJ</h3>
                <p>Ürünlerinize değer katan, dayanıklı ve premium ambalaj çözümleri.</p>
            </div>
            <div class="card">
                <h3>TASARIM</h3>
                <p>Markanızı rakiplerden ayıran yenilikçi ve estetik tasarım dili.</p>
            </div>
            <div class="card">
                <h3>ÜRETİM</h3>
                <p>Yüksek kapasiteli tesisimizde sıfır hata ile zamanında üretim.</p>
            </div>
        </div>
    </section>

    <script>
        function setTheme(theme) {
            const btns = document.querySelectorAll('.theme-btn');
            btns.forEach(btn => btn.classList.remove('active'));

            if (theme === 'navy') {
                document.documentElement.setAttribute('data-theme', 'navy');
                btns[1].classList.add('active');
            } else {
                document.documentElement.removeAttribute('data-theme');
                btns[0].classList.add('active');
            }
        }
    </script>
</body>
</html>
